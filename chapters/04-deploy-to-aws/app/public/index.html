<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Guestbook</title>
  <style>body { font-family: sans-serif; max-width: 40rem; }</style>
  <script src="config.js"></script>
</head>
<body>
  <h1 id="title">Guestbook</h1>
  <form id="form">
    <input id="name" placeholder="Your name" required>
    <input id="text" placeholder="Your message" required>
    <button>Sign</button>
  </form>
  <ul id="list"></ul>
  <script>
    const api = (window.API_BASE || "") + "/api/messages";
    const title = document.getElementById("title");
    title.textContent = window.TITLE || "Guestbook";
    async function show() {
      const items = await (await fetch(api)).json();
      const rows = items.map((m) => {
        const li = document.createElement("li");
        li.textContent = `${m.name}: ${m.text}`;
        return li;
      });
      document.getElementById("list").replaceChildren(...rows);
    }
    document.getElementById("form").onsubmit = async (event) => {
      event.preventDefault();
      const body = JSON.stringify({ name: name.value, text: text.value });
      const headers = { "content-type": "application/json" };
      await fetch(api, { method: "POST", headers, body });
      show();
    };
    show();
  </script>
</body>
</html>
