name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: App server parses
        run: node --check app/server.js
      - name: Pulumi TypeScript programs type-check
        run: |
          for p in $(dirname $(find . -maxdepth 2 -name Pulumi.yaml -not -path './chapters/*') ); do
            if [ -f "$p/package.json" ]; then
              echo "== $p"; (cd "$p" && npm ci --no-audit --no-fund && npx tsc --noEmit) || exit 1
            fi
          done
      - name: Unit tests with mocks (no cloud, no Pulumi CLI)
        run: |
          if [ -f local/test/mocks.ts ]; then cd local && npm test; fi
      - name: Python files compile
        run: python -m compileall -q -x 'node_modules|venv' .
      - name: JSON files are valid
        run: find . -name '*.json' -not -name tsconfig.json -not -path '*/node_modules/*' -not -path './.git/*' -print0 | xargs -0 -n1 python -m json.tool > /dev/null
